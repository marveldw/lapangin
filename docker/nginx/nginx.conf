user nginx;
worker_processes 1; # Small VPS: 1 worker process to strictly conserve RAM
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 512; # Low connection limit appropriate for 1-2GB VPS
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance & Memory optimizations for small VPS
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    types_hash_max_size 2048;
    server_tokens off;

    # Low buffer sizes to minimize per-connection RAM consumption
    client_body_buffer_size 128k;
    client_max_body_size 20M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Gzip Compression for low-bandwidth transfer
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Upstream definitions
    upstream nextjs_upstream {
        server frontend:3000;
        keepalive 8;
    }

    upstream php_fpm_upstream {
        server backend:9000;
    }

    # HTTP Server
    server {
        listen 80;
        server_name _;

        # Root for direct Laravel static file serving
        root /var/www/html/public;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # -------------------------------------------------------------
        # 1. Laravel Static Uploads & Public Assets (Served directly by Nginx)
        # -------------------------------------------------------------
        location ^~ /storage/ {
            alias /var/www/html/storage/app/public/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            access_log off;
            try_files $uri =404;
        }

        # -------------------------------------------------------------
        # 2. Laravel API, Filament Admin, & Livewire (FastCGI to PHP-FPM)
        # -------------------------------------------------------------
        location ^~ /api/ {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ^~ /admin {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ^~ /livewire {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass php_fpm_upstream;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_buffering on;
            fastcgi_buffer_size 16k;
            fastcgi_buffers 4 16k;
            fastcgi_busy_buffers_size 32k;
            fastcgi_read_timeout 60s;
        }

        # -------------------------------------------------------------
        # 3. Next.js Frontend (Reverse Proxy to Node Standalone)
        # -------------------------------------------------------------
        location / {
            try_files $uri @nextjs;
        }

        location @nextjs {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 8k;
        }

        # Hidden file protection (.git, .env, etc)
        location ~ /\.(?!well-known) {
            deny all;
        }
    }

    # -------------------------------------------------------------
    # SSL Termination Placeholder (Gunakan Certbot / Let's Encrypt di VPS)
    # Catatan: Letakkan sertifikat di host VPS dan mount ke volume Nginx.
    # Jangan pernah membakar file sertifikat SSL ke dalam Docker image.
    # -------------------------------------------------------------
    # server {
    #     listen 443 ssl http2;
    #     server_name yourdomain.com;
    #
    #     ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #
    #     # Salin seluruh konfigurasi location di atas ke dalam blok SSL ini
    # }
}
