services:
  # --------------------------------------------------
  # 1. DATABASE (PostgreSQL 18 Alpine)
  # --------------------------------------------------
  db:
    image: postgres:18-alpine
    container_name: lapangin_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - lapangin_network

  # --------------------------------------------------
  # 2. BACKEND (Laravel 12 + PHP-FPM + Nginx)
  # --------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lapangin_backend
    restart: unless-stopped
    ports:
      - "8080:8000"
    environment:
      # --- App ---
      APP_NAME: Lapangin
      APP_ENV: ${APP_ENV}
      APP_DEBUG: "${APP_DEBUG}"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      # --- Database ---
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # --- Laravel Services ---
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - lapangin_network

  # --------------------------------------------------
  # 3. FRONTEND (Next.js 16 + Node 20 Alpine)
  # --------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: lapangin_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NODE_ENV: production
      PORT: 3000
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - lapangin_network

# Persistent Storage
volumes:
  postgres_data:
    driver: local

# Jaringan Terisolasi
networks:
  lapangin_network:
    driver: bridge
