services:
  # --------------------------------------------------
  # 1. DATABASE (PostgreSQL 15 Alpine)
  # --------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: lapangin_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lapangin}
      POSTGRES_USER: ${POSTGRES_USER:-lapangin_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lapangin_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - lapangin_pgdata_clean:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-lapangin_user} -d $${POSTGRES_DB:-lapangin}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - lapangin_network

  # --------------------------------------------------
  # 2. BACKEND (Laravel 12 + PHP-FPM + Nginx bundled)
  # --------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lapangin_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8088}:8000"
    environment:
      # --- App ---
      APP_NAME: "${APP_NAME:-Lapangin}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY:-base64:e/PQQEqKUCo8RPzIV86qY1ZTsCKRxl7/74eZ0eUk33Q=}"
      APP_URL: "${APP_URL:-http://localhost:8088}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3001}"
      # --- Database (PostgreSQL) ---
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-lapangin}
      DB_USERNAME: ${POSTGRES_USER:-lapangin_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-lapangin_password}
      # --- Laravel Services ---
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - lapangin_network

  # --------------------------------------------------
  # 3. FRONTEND (Next.js Standalone Node 20 Alpine)
  # --------------------------------------------------
  frontend:
    image: marvellinadw/lapangin-frontend:latest
    container_name: lapangin_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8088/api}
      NODE_ENV: production
      PORT: 3000
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - lapangin_network

# Persistent Storage (Using clean volume name to bypass stale MySQL volume collisions)
volumes:
  lapangin_pgdata_clean:
    driver: local

# Jaringan Terisolasi
networks:
  lapangin_network:
    driver: bridge
